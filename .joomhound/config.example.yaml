# JoomHound configuration file
# Copy to ~/.joomhound/config.yaml or pass --config /path/to/config.yaml.
# Precedence: CLI flags > JOOMHOUND_* environment variables > this file > defaults.

# Global passive defaults
timeout: 30
threads: 10
rate-limit: 10
proxy: "" # http://host:port, https://host:port, or socks5://host:port
user-agent: ""
verify-ssl: false
no-redirects: false
verbose: false
quiet: false

# Report defaults
format: text # text, json, xml, or markdown

# Enumeration defaults (used by `enum`)
version-detect: true
components: true
templates: true
cve: true

# CVE provider defaults
cve-online: false
cve-cache-dir: "" # empty uses $HOME/.joomhound/cache/cve
cve-cache-ttl: 24 # hours

# Prefer NVD_API_KEY and GITHUB_TOKEN environment variables for secrets.
nvd-api-key: ""
github-token: ""

# Additional delay between credential attempts, in milliseconds.
brute-delay: 0

# Safety: target URLs, --brute, usernames, wordlists, output paths, component
# queries, version queries, and --purge-cache are CLI-only. A config file can
# never start credential testing or select a target by itself.
